[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wasi-master/corvane"
rust-version = "1.92"

[workspace.dependencies]
# UI: GPUI via gpui-kit. Pin exactly; upgrade only on a dedicated branch.
gpui-kit = { version = "=0.7.0", default-features = false, features = ["component", "assets"] }
# Only referenced to toggle the `runtime_shaders` feature (no Xcode needed for dev builds).
gpui-pre-apple = "=0.3.7"

# Internal crates
corvane-core = { path = "crates/corvane-core" }
corvane-git = { path = "crates/corvane-git" }
corvane-github = { path = "crates/corvane-github" }
corvane-grammars = { path = "crates/corvane-grammars" }
corvane-highlight = { path = "crates/corvane-highlight" }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig", "dump-load", "default-syntaxes"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
# Opt-in tree-sitter highlighting (grammars live in corvane-grammars / the tree-sitter packs)
tree-sitter = "0.27"
tree-sitter-language = "0.1"
libloading = "0.8"
corvane-models = { path = "crates/corvane-models" }
corvane-packs = { path = "crates/corvane-packs" }
corvane-platform = { path = "crates/corvane-platform" }
corvane-store = { path = "crates/corvane-store" }
corvane-ui = { path = "crates/corvane-ui" }

# Git
gix = "0.88"

# Network + secrets
ureq = { version = "3.4", features = ["json"] }
keyring = "4.2"

# Infra
anyhow = "1"
thiserror = "2"
regex = "1"
# Markdown for PR bodies / comments (GHD renders `marked` in a sandboxed webview)
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rust-embed = "8"
dirs = "6"

# tree-sitter's query analysis and parser are C: unoptimised they take
# seconds on large highlight queries even in development builds
[profile.dev.package.tree-sitter]
opt-level = 3

# up to 192 KB of a diff is highlighted on the main thread (diff_view.rs
# `SYNC_HIGHLIGHT_BYTES`); unoptimised, that stalls dev builds for a second
[profile.dev.package.corvane-highlight]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.onig]
opt-level = 3
[profile.dev.package.onig_sys]
opt-level = 3

# reading back and PNG-encoding CORVANE_SNAPSHOT / parity harness frames:
# unoptimised, a 2734×1628 frame takes seconds (past the 30 s control reply
# under load)
[profile.dev.package.gpui-pre-apple]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# release code with symbols and a fast link, for `sample`/Instruments and the
# timings in .docs/perf.md (`cargo build --profile profiling -p corvane`)
[profile.profiling]
inherits = "release"
lto = "off"
codegen-units = 16
strip = false
debug = "line-tables-only"
incremental = false

# gpui-pre-macos: variable-font weights and glyph dilation like Chromium
# (src/text_system.rs); gpui-pre: text paints from its unsnapped layout origin
# (src/elements/text.rs); gpui-pre-linux: anchored popups on X11 (the context
# and menu bar menus; src/linux/x11) and offscreen frames; gpui-pre-wgpu:
# rendering a window's scene to an image (src/wgpu_renderer.rs). All marked
# "Corvane patch".
[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }

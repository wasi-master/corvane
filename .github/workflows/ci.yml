name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt · clippy · test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # grammars built from source (crates/corvane-grammars/build.rs); the
      # tree-sitter tests need all of them
      - name: cache grammar sources
        id: grammar-src
        uses: actions/cache@v4
        with:
          path: target/grammar-src
          key: grammar-src-${{ hashFiles('tools/ts-queries/languages.toml', 'tools/ts-queries/sources.lock.json') }}
      - name: fetch grammar sources (tree-sitter CLI generates the ones without parser.c)
        if: steps.grammar-src.outputs.cache-hit != 'true'
        run: |
          cargo install tree-sitter-cli --version 0.27.0 --locked --root "$RUNNER_TEMP/ts-cli"
          CORVANE_TREE_SITTER="$RUNNER_TEMP/ts-cli/bin/tree-sitter" python3 tools/ts-queries/fetch.py
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build (release, precompiled Metal shaders)
        run: cargo build --release --no-default-features -p corvane
      - name: code-signing certificate (absent on fork PRs → ad-hoc)
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -n "$MACOS_SIGNING_P12" ]; then packaging/signing-cert.sh ci; else echo "no MACOS_SIGNING_P12 secret: ad-hoc"; fi
      - name: bundle (Liquid Glass icon needs Xcode 26 actool)
        run: |
          export DEVELOPER_DIR="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"
          packaging/bundle.sh release
          test -f target/bundle/Corvane.app/Contents/Resources/Assets.car
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' target/bundle/Corvane.app/Contents/Info.plist
          ditto -c -k --keepParent target/bundle/Corvane.app target/bundle/Corvane.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Corvane.app
          path: target/bundle/Corvane.app.zip

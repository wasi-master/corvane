[package]
name = "corvane"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native GitHub Desktop clone"
default-run = "corvane"

[[bin]]
name = "corvane"
path = "src/main.rs"

[features]
# Compile Metal shaders at runtime so a full Xcode install is not required for
# development builds. Release CI passes --no-default-features to precompile.
default = ["runtime-shaders"]
runtime-shaders = ["gpui-pre-apple/runtime_shaders"]
# Offscreen window snapshots for visual checks without screen-recording rights:
# `CORVANE_SNAPSHOT=<png> [CORVANE_SNAPSHOT_DELAY_MS=4000]` renders the window
# after the delay, saves it and quits; `CORVANE_CONTROL=<port>` serves the parity
# harness (tools/parity). Development only (pulls GPUI's test support).
# The "full" build: every on-demand pack compiled in.
full = ["corvane-highlight/bundled-syntax-extended", "corvane-highlight/bundled-tree-sitter"]
snapshots = [
    "dep:gpui-pre",
    "dep:gpui-pre-macos",
    "dep:image",
    "dep:serde_json",
    "gpui-pre/test-support",
    "gpui-pre-macos/test-support",
]

[dependencies]
libc = "0.2"
gpui-kit.workspace = true
gpui-pre = { version = "=0.3.7", optional = true }
serde_json = { workspace = true, optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
corvane-core.workspace = true
corvane-github.workspace = true
corvane-highlight.workspace = true
corvane-platform.workspace = true
corvane-store.workspace = true
corvane-ui.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
rust-embed.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-apple = { workspace = true, optional = true }
gpui-pre-macos = { version = "=0.3.7", optional = true }

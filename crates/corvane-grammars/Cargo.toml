[package]
name = "corvane-grammars"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tree-sitter grammars and highlight queries for Corvane's opt-in tree-sitter highlighter"

[lib]
# rlib: the "full" build links every grammar in; cdylib: the `tree-sitter-all`
# / `tree-sitter-rest` packs (packaging/packs.sh), loaded with dlopen.
crate-type = ["rlib", "cdylib"]

# Grammar crates may depend on `tree-sitter-language` only: one that pulls
# `tree-sitter` itself as a normal dependency links a second copy of the C
# runtime (`tools/ts-queries/check-deps.sh`).
[features]
default = []
# every grammar (the `tree-sitter-all` pack and the full build)
all = ["lang-haskell", "lang-javascript", "lang-lua", "lang-markdown", "lang-rust"]
# grammars for file types no CodeMirror port covers, plus what they inject
# (the `tree-sitter-rest` pack); `REST` in src/lib.rs lists the same names
rest = ["lang-haskell"]
lang-haskell = ["dep:tree-sitter-haskell"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-lua = ["dep:tree-sitter-lua"]
lang-markdown = ["dep:tree-sitter-md"]
lang-rust = ["dep:tree-sitter-rust"]

[dependencies]
tree-sitter-language.workspace = true
tree-sitter-haskell = { version = "0.23.1", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-md = { version = "0.5.3", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }

[package]
name = "corvane-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Corvane views, widgets and theme (GPUI)"

[dependencies]
gpui-kit.workspace = true
corvane-core.workspace = true
corvane-highlight.workspace = true
corvane-packs.workspace = true
corvane-git.workspace = true
corvane-github.workspace = true
corvane-platform.workspace = true
tracing.workspace = true
libc = "0.2"
# `746-intra-line-graphemes`: intra-line ranges end on grapheme boundaries
unicode-segmentation = "1"
# image diffs: dimensions + the "Difference" blend (same major as GPUI's);
# tga: decoded to PNG for `755-tga-image-diff`
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tga"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.26"
raw-window-handle = "0.6"

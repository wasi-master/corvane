[package]
name = "corvane-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Corvane OS integration: paths, keychain, trash, editors, shells"

[dependencies]
dirs.workspace = true
keyring.workspace = true
minisign-verify = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
ureq.workspace = true

# freedesktop.org Trash spec (the crate corvane-git already uses)
[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5"
# org.freedesktop.Notifications (the crate GPUI's Linux backend uses)
notify-rust = "4"
# the XDG desktop portal's appearance settings (high contrast)
zbus = "5"
# Hunspell dictionaries for the commit form's spellcheck (what Chromium
# checks with on Linux)
spellbook = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"

[dev-dependencies]
tempfile = "3"


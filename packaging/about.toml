# cargo-about configuration for assets/acknowledgements.json
# (packaging/acknowledgements.sh). Licenses Corvane's dependency tree may use;
# `cargo about` fails on anything not listed so a new license gets a look.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Unlicense",
    "bzip2-1.0.6",
]
# only what ships in the macOS bundle
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
private = { ignore = true }

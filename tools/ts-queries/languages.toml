# Grammars of crates/corvane-grammars and where their queries come from
# (tools/ts-queries/README.md). `gen.py` writes the crate's Cargo features and
# grammar table from this file; `sync.py` vendors the queries.
#
#   package    = cargo package providing the grammar (pinned to `version`)
#   language   = its `LanguageFn` constant, or
#   symbol     = the C function, for packages with pre-0.23 bindings
#   extensions = lowercase suffixes after a dot; filenames = exact lowercase names
#   first_line = regex over the first line (shebangs); aliases = injection names
#   source     = nvim | upstream | helix | corvane  (queries; see README.md)
#   nvim / helix = the language's directory there (default: the key)
#   highlights / injections / locals = upstream query paths in the package

[ada]
package = "tree-sitter-ada"
version = "0.1.0"
language = "LANGUAGE"
extensions = ["ads", "adb", "ada"]
source = "nvim"

[agda]
package = "tree-sitter-agda"
version = "1.3.3"
language = "LANGUAGE"
extensions = ["agda", "lagda"]
source = "nvim"

[asciidoc]
package = "tree-sitter-asciidoc"
version = "0.9.0"
symbol = "tree_sitter_asciidoc"
extensions = ["adoc", "asciidoc", "asc"]
aliases = ["adoc"]
source = "upstream"

[asm]
package = "tree-sitter-asm"
version = "0.24.0"
language = "LANGUAGE"
extensions = ["asm", "s", "nasm", "inc"]
aliases = ["assembly", "nasm"]

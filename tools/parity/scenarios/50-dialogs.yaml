name: add-local-repository
description: Add Local Repository dialog, empty and with a non-repository path
setup: repo
steps:
  - menu: add-local-repository
    wait: 600
  - snap: open
  - type: "/tmp"
    wait: 900
  - snap: not-a-repository
---
name: branch-dialogs
description: New Branch (typing an existing name), Rename and Delete branch
setup: repo
steps:
  - menu: create-branch
    wait: 600
  - snap: new-branch
  - type: "feature/login"
    wait: 500
  - snap: new-branch-exists
  - key: escape
  - menu: rename-branch
    wait: 600
  - snap: rename-branch
  - key: escape
  - menu: delete-branch
    wait: 600
  - snap: delete-branch

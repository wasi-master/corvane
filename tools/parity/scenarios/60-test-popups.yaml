# GHD's own UI test hooks (menu events `test-*`) next to Corvane's matching
# CORVANE_POPUP names.
name: move-to-applications
description: Move to Applications folder dialog
setup: repo
# GHD only honours test-* menu events with preview features on
ghd_env: {GITHUB_DESKTOP_PREVIEW_FEATURES: 1}
steps:
  - popup: {ghd: test-move-to-application-folder, corvane: move-to-applications}
    wait: 700
  - snap: open
# test-upstream-already-exists is not compared: GHD only shows it for a
# repository with a GitHub remote, which the fixture does not have (it shows
# "No GitHub repository to test with" instead).

# First launch (fresh profile / data dir). Presses are released off the
# button (a cancelled click in both apps): a real click on "Sign in to
# GitHub.com" would open the browser OAuth page.
name: welcome-start
description: Welcome flow start page, button hover / press, then "Skip this step" → Configure Git
setup: welcome
steps:
  - wait: 600
  - dump: start
  - snap: {name: start, mask: [[40, 719, 600, 44]], note: "Corvane states it sends no usage metrics (deviations.md › Welcome)"}
  - hover: {text: "Sign in to GitHub.com", within: "#welcome"}
  - snap: {name: sign-in-hover, mask: [[40, 719, 600, 44]], note: "Corvane states it sends no usage metrics (deviations.md › Welcome)"}
  - press: {text: "Sign in to GitHub.com", within: "#welcome"}
  - snap: {name: sign-in-pressed, mask: [[40, 719, 600, 44]], note: "Corvane states it sends no usage metrics (deviations.md › Welcome)"}
  - release: [700, 790]
  - hover: {text: "Sign in to GitHub Enterprise", within: "#welcome"}
  - snap: {name: enterprise-hover, mask: [[40, 719, 600, 44]], note: "Corvane states it sends no usage metrics (deviations.md › Welcome)"}
  - hover: {text: "Skip this step", within: "#welcome"}
  - snap: {name: skip-hover, mask: [[40, 719, 600, 44]], note: "Corvane states it sends no usage metrics (deviations.md › Welcome)"}
  - click: {text: "Skip this step", within: "#welcome"}
    wait: 800
  - dump: configure-git
  - snap: configure-git
  - hover: {text: "Finish", within: "#welcome"}
  - snap: finish-hover
